name: WCL capture key governance (offline only)

on:
  push:
    branches:
      - work/wcl-platform-key-governance-20261110-v1
    paths:
      - src/adapters/wcl-capture-trust-governance.mjs
      - src/adapters/wcl-signed-capture-admission.mjs
      - tests/wcl-capture-trust-governance.test.mjs
      - tests/wcl-signed-capture-admission.test.mjs
      - tools/ci.mjs
      - .github/workflows/wcl-platform-key-governance-offline.yml

permissions:
  contents: read

jobs:
  trust-governance:
    if: github.repository == 'degong2-code/wcl-fresh216'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check signer governance source and test syntax
        run: |
          set -euo pipefail
          node --check src/adapters/wcl-capture-trust-governance.mjs
          node --check tests/wcl-capture-trust-governance.test.mjs
      - name: Run signed trust governance and prior metadata suites
        run: |
          set -euo pipefail
          node --test tests/wcl-capture-trust-governance.test.mjs \
            tests/wcl-signed-capture-admission.test.mjs \
            tests/wcl-captured-evidence-verifier.test.mjs \
            tests/wcl-catalog-evidence-policy.test.mjs \
            tests/wcl-catalog-port.test.mjs \
            tests/wcl-catalog-integration.test.mjs \
            tests/environment-discovery.test.mjs
      - name: Run existing offline core regression
        run: node tools/ci.mjs
      - name: Declare boundary
        if: always()
        run: |
          echo '### WCL signed capture governance: synthetic offline' >> "$GITHUB_STEP_SUMMARY"
          echo 'No secrets, no real WCL/Blizzard, no API points, no actual persistence, no historical collection or publication. Test-only CAS is an in-memory fixture.' >> "$GITHUB_STEP_SUMMARY"
