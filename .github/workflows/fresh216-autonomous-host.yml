name: Fresh216 autonomous offline CI and private-evidence inventory

# Only owner-controlled direct pushes to this isolated public branch.
# NEVER pull_request, pull_request_target, workflow_run, or fork input.
on:
  push:
    branches:
      - work/fresh216-autonomous-host-20261031
      - work/fresh216-public-actor-proof-livewire-20261031
    paths:
      - .github/workflows/fresh216-autonomous-host.yml
      - src/**
      - experiments/fresh216-one-wave-public-pilot-20261031.json
      - experiments/fresh216-one-wave-public-pilot-v2-20261031.json
      - experiments/fresh216-one-wave-public-pilot-v3-20261031.json
      - tests/**
      - tools/**

permissions:
  contents: read

concurrency:
  group: fresh216-autonomous-owner-branch
  cancel-in-progress: false

jobs:
  offline-core:
    if: >-
      github.repository == 'degong2-code/wcl-fresh216' &&
      (github.ref == 'refs/heads/work/fresh216-autonomous-host-20261031' ||
       github.ref == 'refs/heads/work/fresh216-public-actor-proof-livewire-20261031')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run public, credential-free core checks
        run: |
          set -euo pipefail
          node --version
          node tools/ci.mjs
          echo 'PUBLIC_OFFLINE_CORE_PASS (no WCL, no Sheets, no private data)'
      - name: Explain scope
        if: always()
        run: |
          echo '### Fresh216 offline engine CI' >> "$GITHUB_STEP_SUMMARY"
          echo 'Only public pure-core code and tests. No WCL calls, private data, or Sheets.' >> "$GITHUB_STEP_SUMMARY"

  private-evidence-inventory:
    needs: offline-core
    if: >-
      github.event_name == 'push' &&
      github.repository == 'degong2-code/wcl-fresh216' &&
      (github.ref == 'refs/heads/work/fresh216-autonomous-host-20261031' ||
       github.ref == 'refs/heads/work/fresh216-public-actor-proof-livewire-20261031')
    environment: fresh216-private-read
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Check whether private source read access has been granted
        id: gate
        shell: bash
        env:
          EVIDENCE_READ_TOKEN: ${{ secrets.FRESH216_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$EVIDENCE_READ_TOKEN" ]]; then
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'PRIVATE_INVENTORY_BLOCKED: environment read credential missing'
            echo '### Private inventory: BLOCKED (environment read credential missing)' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo 'present=true' >> "$GITHUB_OUTPUT"
          echo 'PRIVATE_INVENTORY_AUTH_PRESENT (no token disclosed)'
      - name: Checkout pinned private analyzer
        if: steps.gate.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          repository: degong2-code/ai-project-lab
          ref: 708e7c5ff27ad1481f3f35fce84e655c2e87ec24
          token: ${{ secrets.FRESH216_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: evidence/code
      - name: Checkout immutable original A
        if: steps.gate.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          repository: degong2-code/ai-project-lab
          ref: 39573a118f2a57f9dc6758936e9d73e9aa6cebf5
          token: ${{ secrets.FRESH216_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: evidence/source
      - name: Checkout verified C candidate
        if: steps.gate.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          repository: degong2-code/ai-project-lab
          ref: d56befacce6ff8062878ed3a4edec6a55cd91b07
          token: ${{ secrets.FRESH216_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: evidence/delta
      - name: Checkout immutable saved Report bodies
        if: steps.gate.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          repository: degong2-code/ai-project-lab
          ref: 5b302ee00483c1415fa9c3c73df43e8ac4f89dc1
          token: ${{ secrets.FRESH216_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: evidence/report
      - name: Checkout immutable priority plan
        if: steps.gate.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          repository: degong2-code/ai-project-lab
          ref: 811c4e67878f9b70e420fccb4ecf84301d211223
          token: ${{ secrets.FRESH216_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: evidence/plan
      - name: Checkout immutable report20 archive
        if: steps.gate.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          repository: degong2-code/ai-project-lab
          ref: 0d6d00e53b240eccb4977a8d70e625072a557a7a
          token: ${{ secrets.FRESH216_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: evidence/report20
      - name: Checkout immutable report21to100 archive
        if: steps.gate.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          repository: degong2-code/ai-project-lab
          ref: 20d13c718b70f1adfce1216b81f518733f11687c
          token: ${{ secrets.FRESH216_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: evidence/report80
      - name: Checkout immutable report1000pt archive
        if: steps.gate.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          repository: degong2-code/ai-project-lab
          ref: 7ec1e48f9bafa205026c89a8b9aad5809835b32a
          token: ${{ secrets.FRESH216_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: evidence/report1000
      - name: Checkout immutable Boss1000 ranked evidence
        if: steps.gate.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          repository: degong2-code/ai-project-lab
          ref: e31fdbd031b4f70c92e752fc1d5682b4f3bb6492
          token: ${{ secrets.FRESH216_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: evidence/boss1000
      - name: Checkout pinned public pure-core product
        if: steps.gate.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          repository: degong2-code/wcl-fresh216
          ref: 8bb96e64add3703a9c9d60c973754943b64d57be
          persist-credentials: false
          path: evidence/product
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.present == 'true'
        with:
          node-version: '22'
      - name: Inventory residual 348 with read-only pinned evidence
        if: steps.gate.outputs.present == 'true'
        shell: bash
        env:
          FRESH216_TRUSTED_READONLY_HOST: owner-approved-20261031
        run: |
          set -euo pipefail
          # No access token or WCL credentials are passed to the analyzer.
          output="$RUNNER_TEMP/fresh216-private-aggregate.json"
          errors="$RUNNER_TEMP/fresh216-private-errors.txt"
          if ! env -u WCL_CLIENT_ID -u WCL_CLIENT_SECRET \
            node evidence/code/tools/fresh216-recovery348-inventory.mjs \
            "$GITHUB_WORKSPACE/evidence/source" \
            "$GITHUB_WORKSPACE/evidence/delta" \
            "$GITHUB_WORKSPACE/evidence/report" \
            "$GITHUB_WORKSPACE/evidence/plan" \
            "$GITHUB_WORKSPACE/evidence/product" \
            "$GITHUB_WORKSPACE/evidence/report20" \
            "$GITHUB_WORKSPACE/evidence/report80" \
            "$GITHUB_WORKSPACE/evidence/report1000" \
            "$GITHUB_WORKSPACE/evidence/boss1000" \
            > "$output" 2> "$errors"; then
            echo 'PRIVATE_INVENTORY_EXECUTION_BLOCKED'
            grep -oE 'RECOVERY348_[A-Z_]+' "$errors" | head -n 1 || true
            exit 1
          fi
          node - "$output" <<'NODE'
          const fs = require('node:fs');
          const r = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if(r.result !== 'FRESH216_RECOVERY348_OFFLINE_INVENTORY' ||
             r.exactC !== 21252 || r.unresolved?.total !== 348 ||
             r.additionalWclCalls !== 0 || r.sheetsWrites !== 0 ||
             r.repositoryWrites !== 0 || r.containsPrivateIdentifiers !== false ||
             r.otherHistoricalReportCaches?.compressedBatches !== 37 ||
             r.otherHistoricalReportCaches?.additionalWclCalls !== 0 ||
             r.otherHistoricalReportCaches?.additionalSheetWrites !== 0 ||
             r.boss1000Cache?.sourceBatchFiles !== 22 ||
             r.boss1000Cache?.sourceJobsScanned !== 216 ||
             r.boss1000Cache?.verifiedNewProofs !== 0 ||
             r.boss1000Cache?.additionalWclCalls !== 0 ||
             r.boss1000Cache?.sheetsWrites !== 0 ||
             r.recoveryFetchPlanReadOnly?.distinctFightGroups !== 302 ||
             r.recoveryFetchPlanReadOnly?.pendingRankSlots !== 348 ||
             r.recoveryFetchPlanReadOnly?.aliasesTotal !== 604 ||
             r.recoveryFetchPlanReadOnly?.authorizedPaidQueries !== 0 ||
             r.recoveryFetchPlanReadOnly?.additionalWclCalls !== 0)

            throw Error('PRIVATE_INVENTORY_OUTPUT_POLICY_DRIFT');
          const safe = {
            result:r.result,exactC:r.exactC,
            pending:r.unresolved.total,
            named:r.unresolved.named,masked:r.unresolved.masked,
            uniqueFightGroups:r.unresolved.uniqueFightGroups,
            reusedFightGroups:r.existingSavedReports.overlappingFightGroups,
            cachedActorCandidates:r.existingSavedReports.candidateOnlyNotPromoted.candidateMatched,
            newWclCalls:r.additionalWclCalls,
            historicalCompressedBatches:r.otherHistoricalReportCaches.compressedBatches,
            historicalItems:r.otherHistoricalReportCaches.inspectedItems,
            archivedFightOverlap:r.otherHistoricalReportCaches.overlappingFightGroups,
            archivedSlotOverlap:r.otherHistoricalReportCaches.overlappingPendingSlots,
            unpromotedHistoricalCandidates:r.otherHistoricalReportCaches.candidateOnlyUnpromotedSlots,
            unscannedDistinctFights:r.otherHistoricalReportCaches.remainingNoOverlapFightGroups,
            boss1000CachedPages:r.boss1000Cache.rankingPages,
            boss1000RowsScanned:r.boss1000Cache.rankingRowsScanned,
            boss1000OverlappingFights:r.boss1000Cache.overlappingFightGroups,
            boss1000NamedCandidates:r.boss1000Cache.uniquelyMatchedNamedCandidates,
            boss1000MaskedCandidates:r.boss1000Cache.uniquelyMatchedMaskedCandidates,
            boss1000Ambiguous:r.boss1000Cache.ambiguousCandidates,
            distinctReports:r.recoveryFetchPlanReadOnly.distinctReports,
            oneFightPerCall:r.recoveryFetchPlanReadOnly.oneFightPerCall,
            groupedCalls4:r.recoveryFetchPlanReadOnly.maxFourFightsPerReportCall,
            groupedCalls8:r.recoveryFetchPlanReadOnly.maxEightFightsPerReportCall
          };
          // Aggregate-only stdout. No report/actor identifiers, no raw archives.
          console.log(JSON.stringify(safe));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '### Private inventory: PASS (sanitized aggregates only)\n' +
            'Exact C: ' + safe.exactC + '; pending: ' + safe.pending +
            '; cached actor candidates (not promoted): ' +
            safe.cachedActorCandidates + '\n' +
            'Older Report archives: ' + safe.historicalCompressedBatches +
            ' batches, overlapping fights: ' + safe.archivedFightOverlap +
            ', unpromoted candidate slots: ' + safe.unpromotedHistoricalCandidates +
            '\n' +
            'Boss1000: ' + safe.boss1000RowsScanned +
            ' B leaderboard rows; overlapping fight groups: ' +
            safe.boss1000OverlappingFights +
            '; named/masked preview candidates: ' +
            safe.boss1000NamedCandidates + '/' + safe.boss1000MaskedCandidates +
            '\n' +
            'Read-only query plan (not executed): ' + safe.distinctReports +
            ' Reports, ' + safe.oneFightPerCall + ' unbatched calls, ' +
            safe.groupedCalls4 + '/' + safe.groupedCalls8 +
            ' grouped calls (4/8 fight cap)\n');
          NODE
      # Do not upload artifacts, print private response bodies, or write private Git.

  public-one-wave-wcl-pilot:
    needs: offline-core
    if: >-
      github.event_name == 'push' &&
      github.repository == 'degong2-code/wcl-fresh216' &&
      github.ref == 'refs/heads/work/fresh216-autonomous-host-20261031' &&
      github.event.head_commit.message == 'chore(fresh216): authorize one-wave public WCL pilot v3'
    environment: fresh216-private-read
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      contents: write
    steps:
      - name: Checkout trusted public pilot runner at triggering commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Checkout immutable pinned private inventory and source selector
        uses: actions/checkout@v4
        with:
          repository: degong2-code/ai-project-lab
          ref: af91bd222e3833b16416d492dc50efcff68f8fa3
          token: ${{ secrets.FRESH216_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: evidence/pilot-code
      - name: Checkout immutable original A source
        uses: actions/checkout@v4
        with:
          repository: degong2-code/ai-project-lab
          ref: 39573a118f2a57f9dc6758936e9d73e9aa6cebf5
          token: ${{ secrets.FRESH216_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: evidence/pilot-source
      - name: Checkout immutable C candidate
        uses: actions/checkout@v4
        with:
          repository: degong2-code/ai-project-lab
          ref: d56befacce6ff8062878ed3a4edec6a55cd91b07
          token: ${{ secrets.FRESH216_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: evidence/pilot-delta
      - name: Checkout immutable saved Report batches
        uses: actions/checkout@v4
        with:
          repository: degong2-code/ai-project-lab
          ref: 5b302ee00483c1415fa9c3c73df43e8ac4f89dc1
          token: ${{ secrets.FRESH216_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: evidence/pilot-report
      - name: Checkout immutable priority plan
        uses: actions/checkout@v4
        with:
          repository: degong2-code/ai-project-lab
          ref: 811c4e67878f9b70e420fccb4ecf84301d211223
          token: ${{ secrets.FRESH216_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: evidence/pilot-plan
      - name: Checkout immutable historical report20
        uses: actions/checkout@v4
        with:
          repository: degong2-code/ai-project-lab
          ref: 0d6d00e53b240eccb4977a8d70e625072a557a7a
          token: ${{ secrets.FRESH216_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: evidence/pilot-report20
      - name: Checkout immutable historical report21to100
        uses: actions/checkout@v4
        with:
          repository: degong2-code/ai-project-lab
          ref: 20d13c718b70f1adfce1216b81f518733f11687c
          token: ${{ secrets.FRESH216_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: evidence/pilot-report80
      - name: Checkout immutable historical report1000
        uses: actions/checkout@v4
        with:
          repository: degong2-code/ai-project-lab
          ref: 7ec1e48f9bafa205026c89a8b9aad5809835b32a
          token: ${{ secrets.FRESH216_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: evidence/pilot-report1000
      - name: Checkout immutable Boss1000
        uses: actions/checkout@v4
        with:
          repository: degong2-code/ai-project-lab
          ref: e31fdbd031b4f70c92e752fc1d5682b4f3bb6492
          token: ${{ secrets.FRESH216_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: evidence/pilot-boss1000
      - name: Checkout immutable public proof-core
        uses: actions/checkout@v4
        with:
          repository: degong2-code/wcl-fresh216
          ref: 8bb96e64add3703a9c9d60c973754943b64d57be
          persist-credentials: false
          path: evidence/pilot-product
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select ONE bounded private wave without WCL credentials
        env:
          FRESH216_TRUSTED_READONLY_HOST: owner-approved-20261031
          FRESH216_PRIVATE_PILOT_WAVE_OUT: ${{ runner.temp }}/fresh216-pilot-wave.json
        shell: bash
        run: |
          set -euo pipefail
          if ! env -u WCL_CLIENT_ID -u WCL_CLIENT_SECRET \
            node evidence/pilot-code/tools/fresh216-recovery348-inventory.mjs \
              "$GITHUB_WORKSPACE/evidence/pilot-source" \
              "$GITHUB_WORKSPACE/evidence/pilot-delta" \
              "$GITHUB_WORKSPACE/evidence/pilot-report" \
              "$GITHUB_WORKSPACE/evidence/pilot-plan" \
              "$GITHUB_WORKSPACE/evidence/pilot-product" \
              "$GITHUB_WORKSPACE/evidence/pilot-report20" \
              "$GITHUB_WORKSPACE/evidence/pilot-report80" \
              "$GITHUB_WORKSPACE/evidence/pilot-report1000" \
              "$GITHUB_WORKSPACE/evidence/pilot-boss1000" \
              > "$RUNNER_TEMP/fresh216-pilot-inventory.json" \
              2> "$RUNNER_TEMP/fresh216-pilot-errors.txt"; then
            echo 'PILOT_SOURCE_PREFLIGHT_BLOCKED'
            grep -oE 'RECOVERY348_[A-Z_]+' "$RUNNER_TEMP/fresh216-pilot-errors.txt" | head -n 1 || true
            exit 1
          fi
          node - "$RUNNER_TEMP/fresh216-pilot-inventory.json" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(r.exactC!==21252||r.unresolved?.total!==348||
             r.recoveryFetchPlanReadOnly?.distinctReports!==248||
             r.recoveryFetchPlanReadOnly?.additionalWclCalls!==0)
            throw Error('PILOT_PINNED_SOURCE_DRIFT_NO_WCL');
          NODE
          test -s "$FRESH216_PRIVATE_PILOT_WAVE_OUT"
          chmod 600 "$FRESH216_PRIVATE_PILOT_WAVE_OUT"
          echo 'PILOT_SOURCE_PREFLIGHT_PASS (private data retained only in runner temp)'
      - name: Execute maximum ONE WCL GraphQL call after public durable IN_FLIGHT
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
          FRESH216_EVIDENCE_HMAC_KEY: ${{ secrets.FRESH216_EVIDENCE_HMAC_KEY }}
          FRESH216_PRIVATE_PILOT_WAVE_FILE: ${{ runner.temp }}/fresh216-pilot-wave.json
        run: |
          set -euo pipefail
          node tools/run-fresh216-public-pilot-once.mjs
      - name: Summarize privacy and durability
        if: always()
        run: |
          echo '### Fresh216 one-call pilot' >> "$GITHUB_STEP_SUMMARY"
          echo 'Public Git ledger: HMAC-pseudonymized actor proof archives plus hashes and aggregates; never raw report codes, actor IDs or actor names.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No auto retries, C promotion, or Google Sheets writes.' >> "$GITHUB_STEP_SUMMARY"
