name: Fresh216 public API pilot offline preflight
on:
  push:
    branches:
      - work/public-runner-effexp-20261030
    paths:
      - .github/workflows/fresh216-public-pilot-preflight.yml
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'degong2-code/wcl-fresh216'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/public-runner-effexp-20261030
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: No-network safety and query schema preflight
        run: |
          set -euo pipefail
          node --check tools/public-wcl-cost-pilot.mjs
          node tools/public-wcl-cost-pilot.mjs --preflight
          echo "PUBLIC_ONLY_NO_SECRETS_PREFLIGHT_PASS" >> "$GITHUB_STEP_SUMMARY"
