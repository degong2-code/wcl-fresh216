name: WCL platform evidence policy (offline only)

on:
  push:
    branches:
      - work/wcl-platform-evidence-policy-20261110-v1
    paths:
      - src/core/wcl-catalog-evidence-policy.mjs
      - src/core/wcl-catalog-port.mjs
      - src/core/environment-discovery.mjs
      - src/core/analysis-scope.mjs
      - tests/wcl-catalog-evidence-policy.test.mjs
      - tests/wcl-catalog-port.test.mjs
      - tests/wcl-catalog-integration.test.mjs
      - tests/environment-discovery.test.mjs
      - tools/ci.mjs
      - .github/workflows/wcl-platform-evidence-policy-offline.yml

permissions:
  contents: read

jobs:
  attested-policy:
    if: github.repository == 'degong2-code/wcl-fresh216'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check policy/adapter/test syntax
        run: |
          set -euo pipefail
          node --check src/core/wcl-catalog-evidence-policy.mjs
          node --check src/core/wcl-catalog-port.mjs
          node --check src/core/environment-discovery.mjs
          node --check src/core/analysis-scope.mjs
          node --check tests/wcl-catalog-evidence-policy.test.mjs
      - name: Verify evidence policy and previous discovery contracts
        run: |
          set -euo pipefail
          node --test tests/wcl-catalog-evidence-policy.test.mjs \
            tests/wcl-catalog-port.test.mjs \
            tests/wcl-catalog-integration.test.mjs \
            tests/environment-discovery.test.mjs
      - name: Report strict boundaries
        if: always()
        run: |
          echo '### Evidence-gated WCL catalog classifications' >> "$GITHUB_STEP_SUMMARY"
          echo 'Synthetic attestation and metadata only. No WCL/Blizzard OAuth, Secrets, private witnesses, data API calls, Git writes, C/Sheets or Cloudflare.' >> "$GITHUB_STEP_SUMMARY"
