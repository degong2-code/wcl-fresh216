name: Fresh216 public boss-target table parity v2 receipt audit
on:
  push:
    branches: [work/public-runner-effexp-20261030]
    paths: [.github/workflows/fresh216-public-table-parity-v2-audit.yml]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'degong2-code/wcl-fresh216'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/public-runner-effexp-20261030
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate 9pt receipts and 17 exact BossDPS comparisons without Secrets or API
        run: |
          set -euo pipefail
          node --check tools/audit-public-boss-table-parity-v2.mjs
          node tools/audit-public-boss-table-parity-v2.mjs
