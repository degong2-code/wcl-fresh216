name: Fresh216 public whole-report cost independent audit
on:
  push:
    branches: [work/public-runner-effexp-20261030]
    paths: [.github/workflows/fresh216-public-wide-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'degong2-code/wcl-fresh216'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/public-runner-effexp-20261030
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check exact receipt identity and point cost without WCL or secrets
        run: |
          set -euo pipefail
          node tools/audit-public-whole-report-pilot.mjs
