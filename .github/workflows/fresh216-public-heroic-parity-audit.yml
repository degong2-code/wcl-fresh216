name: Fresh216 public Heroic BossDPS table parity receipt audit
on:
  push:
    branches: [work/public-runner-effexp-20261030]
    paths: [.github/workflows/fresh216-public-heroic-parity-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/public-runner-effexp-20261030
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify stored heroic report and gameID filter summaries, zero WCL
        run: |
          set -euo pipefail
          node --check tools/audit-public-heroic-parity.mjs
          node tools/audit-public-heroic-parity.mjs
