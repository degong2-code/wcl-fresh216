name: WCL platform signed evidence end-to-end (offline only)

on:
  push:
    branches:
      - work/wcl-platform-offline-e2e-20261111-v1
    paths:
      - src/adapters/wcl-anchored-admission.mjs
      - src/adapters/wcl-sqlite-capture-ledger.mjs
      - src/adapters/wcl-sqlite-ledger-recovery.mjs
      - src/adapters/wcl-capture-trust-governance.mjs
      - src/adapters/wcl-signed-capture-admission.mjs
      - tests/wcl-anchored-admission-e2e.test.mjs
      - tools/ci.mjs
      - .github/workflows/wcl-platform-offline-e2e.yml

permissions:
  contents: read

jobs:
  full-e2e:
    if: github.repository == 'degong2-code/wcl-fresh216'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate full pipeline test and finalizer syntax
        run: |
          set -euo pipefail
          node --version
          node --check src/adapters/wcl-anchored-admission.mjs
          node --check tests/wcl-anchored-admission-e2e.test.mjs
      - name: Test signed capture through SQLite and external anchor to backup
        run: |
          set -euo pipefail
          node --test tests/wcl-anchored-admission-e2e.test.mjs \
            tests/wcl-sqlite-ledger-recovery.test.mjs \
            tests/wcl-platform-ledger-host-cli.test.mjs \
            tests/wcl-sqlite-capture-ledger.test.mjs \
            tests/wcl-capture-trust-governance.test.mjs \
            tests/wcl-signed-capture-admission.test.mjs \
            tests/wcl-captured-evidence-verifier.test.mjs \
            tests/wcl-catalog-evidence-policy.test.mjs \
            tests/wcl-catalog-port.test.mjs \
            tests/wcl-catalog-integration.test.mjs \
            tests/environment-discovery.test.mjs
      - name: Verify complete existing offline core suites
        run: node tools/ci.mjs
      - name: State explicit evidence boundary
        if: always()
        run: |
          echo '### Synthetic full-pipeline acceptance (TEST_ONLY)' >> "$GITHUB_STEP_SUMMARY"
          echo 'Source bytes, Ed25519 keys and external anchor CAS are synthetic. SQLite files are real but ephemeral.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No upstream capture authentication, user host, Secrets, WCL API points, Blizzard OAuth, promotion, merge or production deployment.' >> "$GITHUB_STEP_SUMMARY"
