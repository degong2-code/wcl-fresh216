name: Fresh216 public multi-boss single expression pilot
on:
  push:
    branches: [work/public-runner-effexp-20261030]
    paths: [.github/workflows/fresh216-public-multiboss-filter.yml]
permissions:
  contents: write
concurrency:
  group: fresh216-public-multiboss-filter-once
  cancel-in-progress: false
jobs:
  compare:
    if: >-
      github.repository == 'degong2-code/wcl-fresh216' &&
      github.ref == 'refs/heads/work/public-runner-effexp-20261030' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/public-runner-effexp-20261030
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline scope and query validation
        run: |
          set -euo pipefail
          node --check tools/public-multiboss-filter-pilot.mjs
          node tools/public-multiboss-filter-pilot.mjs --preflight
      - name: Owner-approved small public WCL multi-boss filter request
        env:
          FRESH216_MULTIBOSS_APPROVED: 'true'
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          node tools/public-multiboss-filter-pilot.mjs --collect
